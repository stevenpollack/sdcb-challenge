name: harness-contract
# Verifies the Makefile contract and required files exist. Does NOT judge quality —
# that is the grader's job. This is a fast gate so a run that forgot a target fails early.
on: [push, pull_request, workflow_dispatch]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files present
        run: |
          set -e
          for f in Makefile eval.meta.json FEATURES.md README.md; do
            test -f "$f" || { echo "missing required file: $f"; exit 1; }
          done
      - name: Makefile targets defined
        run: |
          set -e
          for t in setup run test coverage test-report lint; do
            make -n "$t" >/dev/null 2>&1 || { echo "missing/undefined make target: $t"; exit 1; }
          done
          echo "all required targets defined"
      - name: eval.meta.json is valid JSON with required keys
        run: |
          python3 - <<'PY'
          import json,sys
          m=json.load(open("eval.meta.json"))
          for k in ("coverage_report","coverage_format","junit_report"):
              assert k in m, f"eval.meta.json missing key: {k}"
          print("eval.meta.json OK")
          PY
