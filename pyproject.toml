[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-tui"
version = "0.1.0"
description = "A terminal UI client for the Matrix protocol"
requires-python = ">=3.11"
dependencies = [
    "matrix-nio>=0.25",
    "textual>=0.80",
    "python-dotenv>=1.0",
    "aiohttp>=3.9",
    "aiofiles>=23.0",
]

[project.scripts]
matrix-tui = "matrixclient.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "junit-xml>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
timeout = 120
markers = [
    "integration: marks tests that require a live Matrix homeserver",
]

[tool.coverage.run]
source = ["src/matrixclient"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.json]
output = "coverage-summary.json"
