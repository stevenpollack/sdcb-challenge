[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matrixtui"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matrix-nio>=0.21",
    "textual>=0.61",
    "python-dotenv>=1.0",
    "aiofiles>=23.0",
]

[project.scripts]
matrixtui = "matrixtui.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["matrixtui*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short"
markers = [
    "integration: requires live matrix.org credentials",
]

[tool.coverage.run]
source = ["matrixtui"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
